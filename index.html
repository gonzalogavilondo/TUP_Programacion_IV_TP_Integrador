<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioTech</title>
    <link rel="stylesheet" href="./CSS/style.css">
    <script type="module" src="./JS/app.js"></script>
</head>
<body>
    <header>
        <h1>BiblioTech</h1>
        <p>Catálogo y gestor de libros</p>
    </header>

    <main>
        <section id="agregar-section">
            <h2>Agregar libros</h2>

            <form id="form-libro">
                <div>
                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" name="titulo" required>
                </div>

                <div>
                    <label for="autor">Autor</label>
                    <input type="text" id="autor" name="autor" required>
                </div>

                <div>
                    <label for="genero">Género</label>
                    <input type="text" id="genero" name="genero" required>
                </div>

                <div>
                    <label for="anio">Año</label>
                    <input type="number" id="anio" name="anio" required>
                </div>

                <div>
                    <button type="submit">Agregar libro</button>
                </div>
            </form>
        </section>

        <section id="filtros-section">
            <h2>Filtros</h2>

            <div>
                <label for="buscar">Buscar por título</label>
                <input type="search" id="buscar" name="buscar" placeholder="Título del libro">
            </div>

            <div>
                <label for="filtro-genero">Filtrar por género</label>
                <select id="filtro-genero" name="filtro-genero">
                    <option value="">Todos los géneros</option>
                </select>
            </div>
        </section>

        <section id="catalogo-section">
            <h2>Catálogo</h2>

            <div id="catalogo-libros">
                <!-- Los libros se cargan con JS -->
            </div>
        </section>
    </main>
</body>
</html>
